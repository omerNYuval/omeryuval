name: One-off keyword discovery

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover keywords
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python scripts/discover_keywords.py

      - name: Commit and push updated data
        run: |
          git config user.name "garage-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trends.json
          if ! git diff --cached --quiet; then
            git commit -m "Add keyword discovery result"
            git push
          fi
