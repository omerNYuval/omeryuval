name: Fetch search demand data

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch search volume data
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python scripts/fetch_trends.py

      - name: Commit and push updated data
        run: |
          git config user.name "garage-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trends.json
          if ! git diff --cached --quiet; then
            git commit -m "Update search demand data"
            git push
          fi
